version: "3.8"

services:
  app:
    build: .
    container_name: bitcd-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 强制使用 SQLite（轻量服务器无需单独数据库容器）
      - DATABASE_URL=sqlite:///./blackland.db
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      # 前后端代码挂载进来，改代码只需传文件 + docker compose restart，
      # 不必重建镜像（重建一次要十几分钟，主要在装 torch）
      - ./frontend:/app/frontend:ro
      - ./backend:/app/backend:ro
      # alembic 必须挂载：数据库迁移在应用启动时由 init_db() 执行，
      # 不挂的话容器用的是镜像里烘焙的旧迁移，**新写的迁移永远不生效且不报错**。
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./results:/app/results
      - ./uploads:/app/uploads
      - ./samples/predict:/app/samples/predict
      - ./data/blackland.db:/app/blackland.db
    # Chrome 在容器里默认只有 64MB /dev/shm，本系统有地图、ECharts 大屏、
    # 影像画布这类重页面，渲染进程容易因共享内存不足而崩溃 —— 且崩溃发生在
    # CDP 就绪之后，日志上只表现为任务莫名失败。代码侧已加
    # --disable-dev-shm-usage，这里再把实际共享内存调大，两头都堵上。
    shm_size: 1gb
    # Agent 每次运行会拉起 Chrome，它 fork 出的 renderer/gpu 子进程在被杀后
    # 由 PID 1 负责回收。容器里 PID 1 默认是 uvicorn，它不做这件事，于是这些
    # 已死的子进程会以 <defunct>（僵尸）形式堆积、占着 PID 不放 —— 实测一次
    # 运行留下 8 个。init: true 会插入一个真正的 init（tini）来回收它们。
    init: true
    restart: unless-stopped
