<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>传感器参数表</title>
<style>
  table {
    border-collapse: collapse;
    width: 100%;
    font-family: "宋体", SimSun, serif;
    font-size: 10.5pt;
  }
  th, td {
    border: 1px solid black;
    padding: 6px 10px;
    text-align: center;
    vertical-align: middle;
  }
  th {
    background-color: #d9e2f3;
    font-weight: bold;
  }
</style>
</head>
<body>
<table>
  <thead>
    <tr>
      <th>传感器类型</th>
      <th>数据类型</th>
      <th>波段数</th>
      <th>波长 (μm)</th>
      <th>空间分辨率</th>
      <th>幅宽 (km)</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>全色相机（2 台）</td>
      <td>全色</td>
      <td>1</td>
      <td>0.45~0.90</td>
      <td>1 m</td>
      <td>45</td>
    </tr>
    <tr>
      <td rowspan="4">多光谱相机（2 台）</td>
      <td rowspan="4">多光谱</td>
      <td rowspan="4">4</td>
      <td>0.45~0.52</td>
      <td rowspan="4">4 m</td>
      <td rowspan="4">45</td>
    </tr>
    <tr>
      <td>0.52~0.59</td>
    </tr>
    <tr>
      <td>0.63~0.69</td>
    </tr>
    <tr>
      <td>0.77~0.89</td>
    </tr>
  </tbody>
</table>
</body>
</html>
