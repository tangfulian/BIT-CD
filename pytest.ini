[pytest]
# scripts/smoke_test.py hits a live server, issues requests at module import and
# calls sys.exit(1) when it cannot log in. Its name matches the default test_*.py
# pattern, so a bare `pytest` used to die during collection and look like
# "this project's tests are broken". It is still runnable as a script:
#   python scripts/smoke_test.py
#
# NOTE: keep this file ASCII-only. iniconfig opens .ini files with the locale
# encoding (GBK on this Windows box) and raises UnicodeDecodeError on anything
# else -- a crash at startup, before a single test is collected.
testpaths = tests
